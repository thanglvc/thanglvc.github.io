<text x="620.0" y="542.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">GET danh mục, khóa select/Lưu</text>
<text x="620.0" y="566.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">BE đọc categories; không ghi DB</text>
