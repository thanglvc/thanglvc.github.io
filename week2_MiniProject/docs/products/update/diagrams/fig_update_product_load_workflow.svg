<rect x="440" y="60" width="360" height="60" rx="30.0" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="90.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Mở /products/{id}/edit</text>
<rect x="440" y="155" width="360" height="95" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="178.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Khóa Lưu; GET sản phẩm</text>
<text x="620.0" y="202.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">BE binding + load category</text>
<text x="620.0" y="226.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">GET không ghi DB</text>
