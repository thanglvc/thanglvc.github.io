<text x="620.0" y="873.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Không còn → placeholder</text>
<text x="620.0" y="897.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Không tự chọn ID khác</text>
<text x="620.0" y="921.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Mở Lưu khi lựa chọn hợp lệ</text>
<rect x="440" y="1000" width="360" height="65" rx="32.5" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="1032.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Đợi người dùng sửa và Lưu</text>
</svg>
