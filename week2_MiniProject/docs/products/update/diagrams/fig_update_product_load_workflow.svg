<rect x="925" y="645" width="285" height="125" rx="8" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
<text x="1067.5" y="683.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Rỗng hoặc lỗi theo DD danh mục</text>
<text x="1067.5" y="707.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Giữ ba field đã nhập</text>
<text x="1067.5" y="731.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Khóa select/Lưu</text>
