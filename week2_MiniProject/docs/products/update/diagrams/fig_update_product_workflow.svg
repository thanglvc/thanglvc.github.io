<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1450" viewBox="0 0 1280 1450" role="img" aria-labelledby="title desc">
<title id="title">Cập nhật sản phẩm — validate và PUT</title>
<desc id="desc">Luồng FE và BE. Hình bo tròn: bắt đầu/kết thúc. Hình chữ nhật: xử lý. Hình thoi: điều kiện. Mũi tên nét liền: thứ tự xử lý.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="640" y="32" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#0f172a">Cập nhật sản phẩm — validate và PUT</text>
<path d="M620.0,120 L620.0,170" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M440,240.0 L350,237.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="355" y="230" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Không</text>
<path d="M620.0,310 L620.0,365" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="342" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Có</text>
<path d="M620.0,465 L620.0,510" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M800,582.5 L925,582.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="840" y="575" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Không</text>
<path d="M620.0,655 L620.0,705" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="686" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Có</text>
<path d="M620.0,805 L620.0,850" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M440,922.5 L350,932.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="355" y="912" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Không</text>
<path d="M620.0,995 L620.0,1045" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="1025" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Có</text>
<path d="M620.0,1155 L620.0,1310" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M65,237.5 L30,237 L30,1347 L440,1347.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M207.5,1010 L207,1270 L365,1270 L365,1347 L440,1347.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1067.5,660 L1067,1347 L800,1347.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="440" y="60" width="360" height="60" rx="30.0" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="90.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Lưu / Enter; bỏ qua nếu busy</text>
<polygon points="620.0,170 800,240.0 620.0,310 440,240.0" fill="#fef3c7" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="240.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">FE chuẩn hóa và validate đủ?</text>
<rect x="65" y="175" width="285" height="125" rx="8" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
<text x="207.5" y="213.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Không PUT</text>
<text x="207.5" y="237.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Báo đủ lỗi, focus field đầu</text>
<text x="207.5" y="261.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Sửa chỉ xóa lỗi field đó</text>
<rect x="440" y="365" width="360" height="100" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="391.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Snapshot đủ bốn key</text>
<text x="620.0" y="415.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Khóa form; nhãn Đang lưu…</text>
<text x="620.0" y="439.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">PUT với headers JSON</text>
<polygon points="620.0,510 800,582.5 620.0,655 440,582.5" fill="#fef3c7" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="582.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Header, ID và rule đạt?</text>
<rect x="925" y="505" width="285" height="155" rx="8" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
<text x="1067.5" y="546.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">415 / 404 / 422; chưa update</text>
<text x="1067.5" y="570.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Giữ dữ liệu, bỏ busy</text>
<text x="1067.5" y="594.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">404 khóa Lưu</text>
<text x="1067.5" y="618.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">422 category: reload danh mục</text>
<rect x="440" y="705" width="360" height="100" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="731.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">BE update validated đúng ID</text>
<text x="620.0" y="755.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Giữ ID/created_at; load category</text>
<text x="620.0" y="779.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Không có transaction toàn luồng</text>
<polygon points="620.0,850 800,922.5 620.0,995 440,922.5" fill="#fef3c7" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="922.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">200 đúng schema và ID?</text>
<rect x="65" y="855" width="285" height="155" rx="8" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
<text x="207.5" y="896.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">500 / mạng / response sai</text>
<text x="207.5" y="920.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Giữ form; chưa xác nhận kết quả</text>
<text x="207.5" y="944.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Không tự retry</text>
<text x="207.5" y="968.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">DB có thể đã cập nhật</text>
<rect x="440" y="1045" width="360" height="110" rx="8" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="1076.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Cập nhật sản phẩm thành công</text>
<text x="620.0" y="1100.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Nhận dữ liệu chuẩn hóa</text>
<text x="620.0" y="1124.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Giữ form/category; không reset</text>
<rect x="440" y="1310" width="360" height="75" rx="37.5" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="1335.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Bỏ busy, khôi phục nhãn</text>
<text x="620.0" y="1359.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Enabled theo product/danh mục</text>
</svg>
