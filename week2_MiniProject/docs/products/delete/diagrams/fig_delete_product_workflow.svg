<text x="207.5" y="864.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">500 / mạng / status sai</text>
<text x="207.5" y="888.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Chưa xác nhận kết quả xóa</text>
<text x="207.5" y="912.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Giữ UI; không retry</text>
<text x="207.5" y="936.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">DB có thể đã xóa</text>
<rect x="440" y="1020" width="360" height="120" rx="8" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="1044.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">204 không parse JSON</text>
<text x="620.0" y="1068.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Xóa sản phẩm thành công</text>
<text x="620.0" y="1092.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">List: GET trang hiện tại</text>
<text x="620.0" y="1116.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Detail: về /products</text>
<rect x="440" y="1210" width="360" height="70" rx="35.0" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="1245.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Bỏ busy, mở nút còn tồn tại</text>
