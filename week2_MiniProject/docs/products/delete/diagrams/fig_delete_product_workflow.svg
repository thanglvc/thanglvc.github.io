<path d="M440,895.0 L350,900.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="355" y="885" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Không</text>
