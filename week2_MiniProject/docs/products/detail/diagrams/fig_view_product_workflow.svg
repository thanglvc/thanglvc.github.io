<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="title desc">
<title id="title">Chi tiết sản phẩm — đọc và hiển thị</title>
<desc id="desc">Luồng FE và BE. Hình bo tròn: bắt đầu/kết thúc. Hình chữ nhật: xử lý. Hình thoi: điều kiện. Mũi tên nét liền: thứ tự xử lý.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="640" y="32" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#0f172a">Chi tiết sản phẩm — đọc và hiển thị</text>
<path d="M620.0,120 L620.0,160" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620.0,245 L620.0,300" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M440,367.5 L350,367.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="355" y="356" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Không</text>
<path d="M620.0,435 L620.0,490" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="467" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Có</text>
<path d="M620.0,575 L620.0,630" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M800,697.5 L925,697.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="840" y="690" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Không</text>
<path d="M620.0,765 L620.0,820" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="800" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Có</text>
<path d="M620.0,920 L620.0,975" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M207.5,430 L207,1007 L440,1007.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1067.5,760 L1067,1007 L800,1007.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M800,202.5 L1240,202 L1240,697 L1210,697.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="873" y="187" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Exception / mạng</text>
<rect x="440" y="60" width="360" height="60" rx="30.0" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="90.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Mở /products/{id}</text>
<rect x="440" y="160" width="360" height="85" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="190.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">FE hiện loading, khóa Sửa/Xóa</text>
<text x="620.0" y="214.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">GET /api/products/{id}</text>
<polygon points="620.0,300 800,367.5 620.0,435 440,367.5" fill="#fef3c7" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="367.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">BE tìm thấy sản phẩm?</text>
<rect x="65" y="305" width="285" height="125" rx="8" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
<text x="207.5" y="343.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">404: không tồn tại</text>
<text x="207.5" y="367.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">FE hiện not-found</text>
<text x="207.5" y="391.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Chỉ còn link về danh sách</text>
<rect x="440" y="490" width="360" height="85" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="520.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">BE load category</text>
<text x="620.0" y="544.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Resource 200; không ghi DB</text>
<polygon points="620.0,630 800,697.5 620.0,765 440,697.5" fill="#fef3c7" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="697.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">200, schema và ID đúng?</text>
<rect x="925" y="635" width="285" height="125" rx="8" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
<text x="1067.5" y="673.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">500 / mạng / response sai</text>
<text x="1067.5" y="697.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Báo lỗi tải, bỏ loading</text>
<text x="1067.5" y="721.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Không mở Sửa/Xóa</text>
<rect x="440" y="820" width="360" height="100" rx="8" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="846.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Render đủ field, text an toàn</text>
<text x="620.0" y="870.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Null có cách hiển thị</text>
<text x="620.0" y="894.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Mở Sửa/Xóa đúng ID</text>
<rect x="440" y="975" width="360" height="65" rx="32.5" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="1007.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Hoàn tất; về danh sách được</text>
</svg>
