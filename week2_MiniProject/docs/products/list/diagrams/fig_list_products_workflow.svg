<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1300" viewBox="0 0 1280 1300" role="img" aria-labelledby="title desc">
<title id="title">Danh sách sản phẩm — tải và phân trang</title>
<desc id="desc">Luồng FE và BE. Hình bo tròn: bắt đầu/kết thúc. Hình chữ nhật: xử lý. Hình thoi: điều kiện. Mũi tên nét liền: thứ tự xử lý.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="640" y="32" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#0f172a">Danh sách sản phẩm — tải và phân trang</text>
<path d="M620.0,120 L620.0,150" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620.0,230 L620.0,260" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620.0,345 L620.0,385" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M440,455.0 L345,455.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="360" y="444" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Không</text>
<path d="M620.0,525 L620.0,575" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="646" y="556" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Có</text>
<path d="M800,645.0 L925,640.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="844" y="629" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Có</text>
<path d="M620.0,715 L620.0,765" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="646" y="746" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Không</text>
<path d="M800,835.0 L925,835.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="844" y="819" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Có</text>
<path d="M620.0,905 L620.0,1010" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="646" y="971" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Không</text>
<path d="M620.0,1105 L620.0,1190" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1210,835.0 L1260,835 L1260,190 L800,190.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="982" y="180" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Tải lại tối đa 1 lần</text>
<path d="M205.0,520 L205,1222 L440,1222.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1210,640.0 L1230,640 L1230,1222 L800,1222.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="440" y="60" width="360" height="60" rx="30.0" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="90.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Mở /products hoặc đổi trang</text>
<rect x="440" y="150" width="360" height="80" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="178.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">FE chuẩn hóa page, khóa phân trang</text>
<text x="620.0" y="202.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">GET /api/products?page=n</text>
<rect x="440" y="260" width="360" height="85" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="278.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">BE đọc products + category</text>
<text x="620.0" y="302.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">ID giảm dần; paginate(10)</text>
<text x="620.0" y="326.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">GET không ghi DB</text>
<polygon points="620.0,385 800,455.0 620.0,525 440,455.0" fill="#fef3c7" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">200 và schema đúng?</text>
<rect x="65" y="390" width="280" height="130" rx="8" fill="#fee2e2" stroke="#475569" stroke-width="2"/>
<text x="205.0" y="431.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Lỗi GET / mạng / response</text>
<text x="205.0" y="455.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Bỏ loading, báo lỗi tải</text>
<text x="205.0" y="479.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Giữ bảng cũ có nhãn lỗi</text>
<polygon points="620.0,575 800,645.0 620.0,715 440,645.0" fill="#fef3c7" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="645.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">meta.total = 0?</text>
<rect x="925" y="580" width="285" height="120" rx="8" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
<text x="1067.5" y="616.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Chưa có sản phẩm</text>
<text x="1067.5" y="640.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Khóa chuyển trang</text>
<text x="1067.5" y="664.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Giữ link Tạo</text>
<polygon points="620.0,765 800,835.0 620.0,905 440,835.0" fill="#fef3c7" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="835.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">page vượt last_page?</text>
<rect x="925" y="765" width="285" height="140" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="1067.5" y="811.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">GET last_page một lần</text>
<text x="1067.5" y="835.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Không lặp nếu metadata sai</text>
<text x="1067.5" y="859.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Lần gọi lại sai → lỗi tải</text>
<rect x="440" y="1010" width="360" height="95" rx="8" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="1033.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">FE render data và meta</text>
<text x="620.0" y="1057.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Action theo đúng ID</text>
<text x="620.0" y="1081.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Mở phân trang theo điều kiện</text>
<rect x="440" y="1190" width="360" height="65" rx="32.5" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="1222.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Hoàn tất tải trang</text>
</svg>
