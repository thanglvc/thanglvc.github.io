<text x="650" y="615" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Có</text>
<path d="M800,705.0 L925,702.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="840" y="696" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Không</text>
<path d="M620.0,775 L620.0,825" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<text x="650" y="805" font-family="sans-serif" font-size="16" fill="#0f172a" paint-order="stroke" stroke="#fff" stroke-width="5" stroke-linejoin="round">Có</text>
<path d="M620.0,940 L620.0,1000" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M207.5,575 L207,1032 L440,1032.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M1067.5,765 L1067,1032 L800,1032.5" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="440" y="60" width="360" height="60" rx="30.0" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="90.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Form tạo/sửa yêu cầu danh mục</text>
<rect x="440" y="165" width="360" height="90" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="198.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Giữ text theo DD màn sở hữu</text>
<text x="620.0" y="222.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Khóa select/submit; GET categories</text>
<rect x="440" y="305" width="360" height="90" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="338.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">BE đọc id/name, ID tăng dần</text>
<text x="620.0" y="362.0" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Không phân trang, không ghi DB</text>
<polygon points="620.0,445 800,515.0 620.0,585 440,515.0" fill="#fef3c7" stroke="#475569" stroke-width="2"/>
