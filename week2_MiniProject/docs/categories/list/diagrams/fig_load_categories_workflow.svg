<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1100" viewBox="0 0 1280 1100" role="img" aria-labelledby="title desc">
<title id="title">Danh mục dùng chung — tải lựa chọn</title>
<desc id="desc">Luồng FE và BE. Hình bo tròn: bắt đầu/kết thúc. Hình chữ nhật: xử lý. Hình thoi: điều kiện. Mũi tên nét liền: thứ tự xử lý.</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#334155"/></marker></defs>
<rect width="100%" height="100%" fill="#fff"/>
<text x="640" y="32" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="700" fill="#0f172a">Danh mục dùng chung — tải lựa chọn</text>
<path d="M620.0,120 L620.0,165" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620.0,255 L620.0,305" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M620.0,395 L620.0,445" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
