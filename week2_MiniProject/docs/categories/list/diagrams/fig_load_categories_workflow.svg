<rect x="925" y="640" width="285" height="125" rx="8" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
<text x="1067.5" y="678.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Chưa có danh mục để chọn</text>
<text x="1067.5" y="702.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Khóa select và gửi</text>
<text x="1067.5" y="726.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Không tạo danh mục tự động</text>
<rect x="440" y="825" width="360" height="115" rx="8" fill="#dcfce7" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="846.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Render option bằng text</text>
<text x="620.0" y="870.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Tạo: placeholder; sửa: giữ ID cũ</text>
<text x="620.0" y="894.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Không còn ID → placeholder</text>
<text x="620.0" y="918.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Không tự gửi POST/PUT</text>
<rect x="440" y="1000" width="360" height="65" rx="32.5" fill="#dbeafe" stroke="#475569" stroke-width="2"/>
<text x="620.0" y="1032.5" dominant-baseline="middle" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#0f172a">Trả quyền điều khiển cho form</text>
</svg>
